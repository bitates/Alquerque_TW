<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Alquerque</title>
    <script src="index.js" defer></script>
    <link rel="stylesheet" href="visuals.css">
</head>

<body>
    <!-- <h1 class="page-title"></h1>-->
    <aside class="leftSidebar">
        <div class="sidebar-header">
            <h1> Alquerque</h1>
        </div>
        <div class="sidebar-buttons">
            <button class="btn" onClick="openPopup()"> ⚙️ Settings </button>
            <button class="btn"> 💡 Instructions </button>
            <button class="btn"> 👑 Leaderboard </button>
            <button class="btn"> 📖 Rules </button>

            <div class="popup" id="popup">
                <button class="gbtn"> Draw </button>
            </div>
        </div>
    </aside>

    <aside class="chatSidebar">
        <div class="chatSidebar-header">
            <h2>Log</h2>
        </div>
        <div class="sidebar-buttons">
            <!-- Your buttons go here -->
        </div>
        <div class="chatSidebar-text" id="gameText">
            > jogador 1 mexeu peça para d2
            <script>
                test();
            </script>
        </div>
    </aside>
    
<main class="game-layout">
        <div class="board">
            
            <svg viewBox="0 0 400 400"
                xmlns="http://www.w3.org/2000/svg"
                class="board-grid">

                <!-- Linhas verticais e horizontais-->
                <path d="
                    M25 25 V375
                    M112.5 25 V375
                    M200 25 V375
                    M287.5 25 V375
                    M375 25 V375

                    M25 25 H375
                    M25 112.5 H375
                    M25 200 H375
                    M25 287.5 H375
                    M25 375 H375
                "/>

                <!-- Diagonais -->
                <path d="
                    M25 25 L112.5 112.5
                    M200 25 L112.5 112.5
                    M200 25 L287.5 112.5
                    M375 25 L287.5 112.5

                    M25 200 L112.5 112.5
                    M200 200 L112.5 112.5
                    M200 200 L287.5 112.5
                    M375 200 L287.5 112.5

                    M25 200 L112.5 287.5
                    M200 200 L112.5 287.5
                    M200 200 L287.5 287.5
                    M375 200 L287.5 287.5

                    M25 375 L112.5 287.5
                    M200 375 L112.5 287.5
                    M200 375 L287.5 287.5
                    M375 375 L287.5 287.5
                "/>

                <!-- Peças -->
                <g class="pieces">
                    <!-- Linha 0 -->
                    <circle cx="25" cy="25" fill="#2c3e50"/>
                    <circle cx="112.5" cy="25" fill="#2c3e50"/>
                    <circle cx="200" cy="25" fill="#2c3e50"/>
                    <circle cx="287.5" cy="25" fill="#2c3e50"/>
                    <circle cx="375" cy="25" fill="#2c3e50"/>

                    <!-- Linha 1 -->
                    <circle cx="25" cy="112.5" fill="#2c3e50"/>
                    <circle cx="112.5" cy="112.5" fill="#2c3e50"/>
                    <circle cx="200" cy="112.5" fill="#2c3e50"/>
                    <circle cx="287.5" cy="112.5" fill="#2c3e50"/>
                    <circle cx="375" cy="112.5" fill="#2c3e50"/>

                    <!-- Linha 2 -->
                    <circle cx="25" cy="200" fill="#2c3e50"/>
                    <circle cx="112.5" cy="200" fill="#2c3e50"/>
                    <circle cx="287.5" cy="200" fill="#e74c3c"/>
                    <circle cx="375" cy="200" fill="#e74c3c"/>

                    <!-- Linha 3 -->
                    <circle cx="25" cy="287.5" fill="#e74c3c"/>
                    <circle cx="112.5" cy="287.5" fill="#e74c3c"/>
                    <circle cx="200" cy="287.5" fill="#e74c3c"/>
                    <circle cx="287.5" cy="287.5" fill="#e74c3c"/>
                    <circle cx="375" cy="287.5" fill="#e74c3c"/>

                    <!-- Linha 4 -->
                    <circle cx="25" cy="375" fill="#e74c3c"/>
                    <circle cx="112.5" cy="375" fill="#e74c3c"/>
                    <circle cx="200" cy="375" fill="#e74c3c"/>
                    <circle cx="287.5" cy="375" fill="#e74c3c"/>
                    <circle cx="375" cy="375" fill="#e74c3c"/>
                </g>
            </svg>

        </div>
        <div class="game-buttons">
            <button class="gbtn"> Draw </button>
            <button class="gbtn"> Withdraw  </button>
            <button class="gbtn"> Start </button>
        </div>
    </main>

</body>
</html>

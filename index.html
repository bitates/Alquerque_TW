<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Alquerque</title>
    <link rel="stylesheet" href="visuals.css">
</head>

<body>
    <!-- <h1 class="page-title"></h1>-->
    <aside class="leftSidebar">
        <div class="sidebar-header">
            <h1> Alquerque</h1>
        </div>
        <div class="sidebar-buttons">
            <button class="btn"> ⚙️ Definições </button>
            <button class="btn"> 💡 Instruções </button>
            <button class="btn"> 👑 Classificações </button>
            <button class="btn"> 📖 Regras </button>
        </div>
    </aside>

    <aside class="chatSidebar">
        <div class="chatSidebar-header">
            <h2>Log</h2>
        </div>
        <div class="sidebar-buttons">
            <!-- Your buttons go here -->
        </div>
        <div class="chatSidebar-text" id="gameText">
            > jogador 1 mexeu peça para d2
        </div>
    </aside>
    
    <main class="game-layout">
        <div class="board">
            <svg viewBox="0 0 400 400"
                xmlns="http://www.w3.org/2000/svg"
                class="board-grid">

                <!-- Vertical and horizontal grid lines -->
                <path d="
                    M100 0 V400
                    M200 0 V400
                    M300 0 V400
                    M0 100 H400
                    M0 200 H400
                    M0 300 H400
                " />

                <!-- Diagonal lines -->
                <path d="
                    M0 0 L100 100
                    M200 0 L100 100
                    M200 0 L300 100
                    M400 0 L300 100

                    M0 200 L100 100
                    M200 200 L100 100
                    M200 200 L300 100
                    M400 200 L300 100

                    M0 200 L100 300
                    M200 200 L100 300
                    M200 200 L300 300
                    M400 200 L300 300

                    M0 400 L100 300
                    M200 400 L100 300
                    M200 400 L300 300
                    M400 400 L300 300
                " />
            </svg>
        </div>
        <div class="game-buttons">
            <button class="gbtn"> EMPATE </button>
            <button class="gbtn"> DESISTIR </button>
            <button class="gbtn"> COMEÇAR </button>
        </div>
    </main>
</body>

</html>
